<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Maze Rush</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= MENU ================= -->
    <section id="menuScreen" class="screen active">

        <div class="logo">
            <span>🧩</span>
            <h1>MAZE RUSH</h1>
            <p>Escape The Labyrinth</p>
        </div>

        <div class="card">

            <h2>🎮 Mulai Bermain</h2>

            <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                maxlength="20"
                autocomplete="off"
            >

            <input
                type="tel"
                id="phone"
                placeholder="Nomor WhatsApp"
                maxlength="15"
                autocomplete="off"
            >

            <button id="startBtn">
                MULAI GAME 🚀
            </button>

        </div>

        <div class="leaderboard">

            <div class="section-title">
                <h2>🏆 Leaderboard</h2>
                <button id="refreshBtn">↻</button>
            </div>

            <div id="leaderboardList">
                <p class="loading">Memuat leaderboard...</p>
            </div>

        </div>

    </section>


    <!-- ================= GAME ================= -->
    <section id="gameScreen" class="screen">

        <div class="game-header">

            <button id="backBtn" class="icon-btn">←</button>

            <div>
                <small>PLAYER</small>
                <strong id="playerName">PLAYER</strong>
            </div>

            <div class="stats">
                <div>
                    <small>TIME</small>
                    <strong id="timer">00:00</strong>
                </div>

                <div>
                    <small>MOVES</small>
                    <strong id="moves">0</strong>
                </div>
            </div>

        </div>


        <div class="maze-wrapper">

            <canvas id="mazeCanvas"></canvas>

        </div>


        <div class="controls">

            <button class="control empty"></button>

            <button class="control" data-direction="up">
                ▲
            </button>

            <button class="control empty"></button>


            <button class="control" data-direction="left">
                ◀
            </button>

            <button class="control" data-direction="down">
                ▼
            </button>

            <button class="control" data-direction="right">
                ▶
            </button>

        </div>

        <p class="instruction">
            Gunakan tombol arah atau keyboard untuk bergerak
        </p>

    </section>


    <!-- ================= FINISH ================= -->
    <section id="finishScreen" class="screen">

        <div class="finish-card">

            <div class="finish-icon">
                🏆
            </div>

            <h1>LABIRIN SELESAI!</h1>

            <p class="finish-player" id="finishPlayer">
                Player
            </p>

            <div class="result">

                <div>
                    <span>WAKTU</span>
                    <strong id="finalTime">00:00</strong>
                </div>

                <div>
                    <span>LANGKAH</span>
                    <strong id="finalMoves">0</strong>
                </div>

                <div>
                    <span>SKOR</span>
                    <strong id="finalScore">0</strong>
                </div>

            </div>

            <p id="saveStatus" class="save-status">
                Menyimpan skor...
            </p>

            <button id="playAgainBtn">
                🔄 MAIN LAGI
            </button>

            <button id="homeBtn" class="secondary-btn">
                🏠 MENU UTAMA
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
